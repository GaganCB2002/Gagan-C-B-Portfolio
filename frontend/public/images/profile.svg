<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2c4e7a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8942b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#c8942b;stop-opacity:0"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="200" cy="200" r="195"/>
    </clipPath>
  </defs>
  <circle cx="200" cy="200" r="198" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="198" fill="url(#glow)"/>
  <circle cx="200" cy="200" r="195" fill="none" stroke="#c8942b" stroke-width="3" opacity="0.3"/>
  
  <!-- Professional silhouette - suit -->
  <g transform="translate(200,200)">
    <!-- Body/shoulders in suit -->
    <path d="M-70 80 Q-75 120 -90 180 L90 180 Q75 120 70 80 Z" fill="#e8ecf2" opacity="0.12"/>
    <path d="M-55 75 Q-58 100 -65 140 L65 140 Q58 100 55 75 Z" fill="#e8ecf2" opacity="0.15"/>
    <!-- Collar -->
    <path d="M-15 75 L0 110 L15 75 Z" fill="#c8942b" opacity="0.25"/>
    <!-- Head -->
    <ellipse cx="0" cy="-35" rx="42" ry="48" fill="#e8ecf2" opacity="0.15"/>
    <ellipse cx="0" cy="-30" rx="38" ry="44" fill="#e8ecf2" opacity="0.1"/>
    
    <!-- GCB Initials on chest -->
    <text x="0" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#c8942b" letter-spacing="3" opacity="0.7">GCB</text>
    
    <!-- Title underline -->
    <rect x="-60" y="122" width="120" height="1.5" rx="1" fill="#c8942b" opacity="0.3"/>
    
    <!-- Role -->
    <text x="0" y="138" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="2.5">SOFTWARE ENGINEER</text>
  </g>
  
  <!-- Gold accent arc top -->
  <path d="M20 40 Q200 -10 380 40" fill="none" stroke="#c8942b" stroke-width="1.5" opacity="0.2"/>
  <path d="M30 48 Q200 -2 370 48" fill="none" stroke="#c8942b" stroke-width="1" opacity="0.1"/>
  
  <!-- Bottom arc -->
  <path d="M40 370 Q200 400 360 370" fill="none" stroke="#c8942b" stroke-width="1.5" opacity="0.15"/>
</svg>
